name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'מספר גרסה (ריק = אוטומטי)'
        type: string
        default: ''

env:
  BASE_VERSION: '1.0'   # גרסה אוטומטית: <BASE_VERSION>.<מספר ריצה>, למשל 1.0.7

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and '${{ github.event.inputs.version }}') { $v = '${{ github.event.inputs.version }}'.TrimStart('v') }
          else { $v = "$($env:BASE_VERSION).$($env:GITHUB_RUN_NUMBER)" }
          "version=$v" >> $env:GITHUB_OUTPUT

      # ---------- background guard (C#, Native AOT) ----------
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish guard
        shell: pwsh
        run: dotnet publish guard/OtzariaCompanionGuard.csproj -c Release -r win-x64 -o out/guard

      # ---------- settings UI (Flutter) ----------
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Flutter Windows runner
        shell: pwsh
        run: ./scripts/prepare-ui.ps1

      - name: Build UI
        shell: pwsh
        working-directory: ui
        run: |
          flutter pub get
          flutter build windows --release

      # ---------- assemble ----------
      - name: Assemble app folder
        shell: pwsh
        run: |
          $app = 'dist/OtzariaCompanionTracker'
          New-Item "$app/ui" -ItemType Directory -Force | Out-Null
          Copy-Item out/guard/OtzariaCompanionGuard.exe $app
          Copy-Item 'ui/build/windows/x64/runner/Release/*' "$app/ui" -Recurse
          Compress-Archive -Path $app -DestinationPath "dist/OtzariaCompanionTracker-Portable.zip"

      # ---------- installer ----------
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer\setup.iss

      - uses: actions/upload-artifact@v4
        with:
          name: OtzariaCompanionTracker
          path: |
            dist/*.zip
            dist/*.exe

      # ---------- release ----------
      # every push to main / tag / manual run -> a NEW release (tag + release together, marked Latest).
      # pull requests -> build only.
      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v   = '${{ steps.ver.outputs.version }}'
          $tag = "v$v"
          $repo = $env:GITHUB_REPOSITORY
          $base = "https://github.com/$repo/releases/latest/download"

          @"
          ## מעקב תוכנות נלוות לאוצריא $v

          | קובץ | הורדה |
          |---|---|
          | התקנה (מומלץ) | [OtzariaCompanionTracker-Setup.exe]($base/OtzariaCompanionTracker-Setup.exe) |
          | גרסה ניידת | [OtzariaCompanionTracker-Portable.zip]($base/OtzariaCompanionTracker-Portable.zip) |

          הקישורים האלה תמיד מצביעים על הגרסה האחרונה.
          "@ | Set-Content notes.md -Encoding UTF8

          $setup    = 'dist/OtzariaCompanionTracker-Setup.exe#התקנה'
          $portable = 'dist/OtzariaCompanionTracker-Portable.zip#גרסה ניידת'

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # re-run: replace the files of the existing release
            gh release upload $tag $setup $portable --clobber
          } else {
            gh release create $tag $setup $portable `
              --target $env:GITHUB_SHA `
              --title "מעקב תוכנות נלוות לאוצריא $v" `
              --notes-file notes.md --generate-notes --latest
          }
